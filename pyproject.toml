[project]
name = "dsh-unhappy-pv"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # Rendering side: frame drawing (pillow) and array math (numpy). Declared
    # before film/ lands on purpose - a package installed by hand outside the
    # lock is deleted by the next `uv sync`.
    # Lyrics tool (tools/lyrict). It declares the same two third-party
    # requirements in its own pyproject.toml; they are repeated here so that a
    # single root `uv sync` installs everything this repository needs.
    "lyrict",
    "mutagen>=1.47,<2",
    "numpy>=2.5,<3",
    "pillow>=12.3,<13",
    "tqdm>=4.66,<5",
]

[tool.uv.sources]
# Take lyrict from tools/lyrict/ instead of PyPI (upstream is not published).
lyrict = { workspace = true }

[tool.uv.workspace]
members = ["tools/lyrict"]

[tool.uv]
# The root is a real distribution so that `uv sync` installs every workspace
# member (tools/lyrict included) into the repository's single .venv.
package = true

[tool.setuptools]
# No importable package at the root yet; `film/` becomes one when it lands.
# tools/lyrict/ is a workspace member and is installed by its own pyproject.
packages = []
